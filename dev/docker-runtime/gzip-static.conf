# gzip-static.conf — send the .gz a Vite build wrote beside each asset (@frediverse/vite-config).
# Included inside http{}, so it covers every app's server block. No on-the-fly gzip: the build
# already compressed everything worth it. See dev/vite-config/docs/compression.md.
# No gzip_vary here: Alpine's stock nginx.conf already sets it, and nginx refuses a duplicate.
gzip_static on;
