# Shared nginx proxy headers, baked into the base image at
# /etc/nginx/snippets/proxy-common.conf. Every app's nginx.conf repeats this
# block in each `location` that fronts a backend, so it lives here once:
#
#   location /api/ {
#       proxy_pass http://127.0.0.1:8787;
#       include /etc/nginx/snippets/proxy-common.conf;
#   }
#
# X-Forwarded-Proto is passed through from the edge (Caddy/Traefik) rather than
# hard-coded, so the backend issues Secure cookies only when the public request
# really was https.
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
